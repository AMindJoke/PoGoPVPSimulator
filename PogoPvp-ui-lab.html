<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GO Judge Hub UI Lab</title>
  <style>
    html, body { min-height: 100%; margin: 0; background: #f4f1e9; color: #182b3a; font-family: system-ui, sans-serif; }

  </style>
</head>
<body>
  <div class="ui-lab-loader">Loading UI Lab…</div>
  <script>
    (() => {
      const labCss = String.raw`
        /* UI Lab only: the source page receives this class before its runtime starts. */
        body.ui-lab {

        body.ui-lab .battle-cta-row > * { pointer-events: auto; }
        body.ui-lab .battle-cta { min-width: 184px; }

        /* Derived UI-only result band; it reads existing DOM values and does not calculate battles. */

          border-left: 4px solid var(--lab-outcome, var(--accent)); border-radius: 10px;

        body.ui-lab .ui-lab-outcome-kicker { display: block; color: var(--muted); font-size: 8px; font-weight: 950; letter-spacing: .08em; text-transform: uppercase; }

        body.ui-lab .stat-bars { margin: 3px 0 0; }
        body.ui-lab .advanced-panel { margin-top: 3px; }
        body.ui-lab .shield-only-row { margin-top: 4px; padding-top: 4px; }

        body.ui-lab .energy-panel { padding-top: 1px; }
        body.ui-lab[data-view="simulator"]:not(.battle-setup-ready) .scenario-setup-helper {

          width: min(100%, 640px);
          margin: 0 auto;
          padding: 0 4px;

          text-align: center;

        body.ui-lab[data-view="simulator"] #battleCta:disabled {

          body.ui-lab .app-tabs::after { content: "›"; position: absolute; right: 1px; top: 3px; bottom: 3px; display: grid; place-items: center; width: 28px; background: linear-gradient(90deg, transparent, var(--panel) 48%); color: var(--muted); font-size: 20px; font-weight: 500; line-height: 1; pointer-events: none; }

          body.ui-lab:not([data-view="scenario-review"]) .setup { grid-template-columns: 1fr; gap: 9px; }
          body.ui-lab:not([data-view="scenario-review"]) .setup::after { display: none; }
          body.ui-lab:not([data-view="scenario-review"]) .trainer-card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
          body.ui-lab .trainer-card > .moves-stack { min-width: 0; }
          body.ui-lab .trainer-card > .control-stack:first-child,
          body.ui-lab .trainer-card > .field-box,
          body.ui-lab .trainer-card > .moves-stack { grid-column: auto; grid-row: auto; }
          body.ui-lab:not([data-view="scenario-review"]) .trainer-card .pokemon-info { display: grid; grid-template-columns: 66px minmax(0, 1fr); align-items: center; }
          body.ui-lab:not([data-view="scenario-review"]) .trainer-card .pokemon-sprite { width: 62px; height: 62px; grid-row: span 2; }
          body.ui-lab:not([data-view="scenario-review"]) .trainer-card .pokemon-stats,
          body.ui-lab:not([data-view="scenario-review"]) .trainer-card .stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }

          body.ui-lab .battle-cta-row { bottom: 7px; }

          body.ui-lab[data-view="simulator"].battle-setup-ready:not(.battle-results-visible) main { padding-bottom: 10px; }

          body.ui-lab[data-view="scenario-review"] #manualMobileBottomSheetShell[data-state="collapsed"] .manual-decision-primary { order: -1; }
          body.ui-lab[data-view="scenario-review"] .manual-editor-actions { gap: 7px; }
          body.ui-lab[data-view="scenario-review"] .manual-editor-actions .actions > button { min-height: 48px; }
          body.ui-lab[data-view="scenario-review"] .manual-scenario-panel,
          body.ui-lab[data-view="scenario-review"] .manual-overlay-controls { display: none; }

          body.ui-lab .team-builder-shell { width: min(100% - 16px, 680px); margin-top: 8px; }

          body.ui-lab .team-final-slot-entry button, body.ui-lab .team-analysis-actions button { min-height: 42px; }

      const labScript = '<script>' + String.raw`
        (() => {
          const byId = id => document.getElementById(id);
          const text = id => (byId(id)?.textContent || '').trim();
          const number = value => Number(String(value).match(/\d+/)?.[0] || 0);
          const hp = id => {
            const value = text(id);
            const parts = value.match(/(\d+)\s*\/\s*(\d+)/);
            return parts ? { current: Number(parts[1]), max: Number(parts[2]) } : null;
          };
          const shieldCount = prefix => Number(byId(prefix + 'Shields')?.value || 0);
          const name = prefix => text(prefix + 'BattleName') || byId(prefix + 'Search')?.value || (prefix === 'p1' ? 'Pokémon A' : 'Pokémon B');
          const energy = prefix => (byId(prefix + 'EnergyPanel')?.textContent || '').match(/\d+/)?.[0] || '0';
          const resultText = () => (byId('battleReview')?.innerText || byId('battleReview')?.textContent || '').trim();
          const timelineTime = () => text('timelineHoverLabel') || text('manualTimelineGrid').match(/T\d+(?:\.\d+)?\s*\/\s*\d+(?:\.\d+)?s/)?.[0] || '';

          function ensureBadge() {
            document.body.classList.add('ui-lab');
            const helper = document.querySelector('.scenario-setup-helper');
            if (helper) helper.textContent = 'Choose both Pokémon to compare the matchup.';
            const title = document.querySelector('header');
            if (title && !document.querySelector('.ui-lab-badge')) {
              const badge = document.createElement('span');
              badge.className = 'ui-lab-badge'; badge.textContent = 'UI Lab';
              title.appendChild(badge);
            }
          }
          function ensureOutcome() {
            const grid = document.querySelector('.analysis-grid');
            if (!grid || byId('uiLabOutcome')) return;
            const box = document.createElement('section');
            box.id = 'uiLabOutcome'; box.className = 'ui-lab-outcome'; box.setAttribute('aria-live', 'polite');
            box.innerHTML = '<div class="ui-lab-outcome-copy"><span class="ui-lab-outcome-kicker">Match result</span><strong></strong><small></small></div><div class="ui-lab-outcome-stats"></div>';
            grid.insertBefore(box, grid.firstChild);
          }
          function updateOutcome() {
            ensureOutcome();
            const box = byId('uiLabOutcome');
            const a = hp('p1HpText'); const b = hp('p2HpText');
            const review = resultText();
            const resultLine = review.split(/\n+/).find(line => /\bwins\s+with\b/i.test(line)) || '';
            const resultMatch = resultLine.match(/^(.+?)\s+wins\s+with\s+(\d+)\s+HP\s+and\s+(\d+)\s+energy/i);
            if (!box || !a || !b || !resultMatch) { if (box?.classList.contains('is-visible')) box.classList.remove('is-visible'); return; }
            const winnerName = resultMatch[1].trim();
            const winnerSide = winnerName === name('p1') ? 'p1' : winnerName === name('p2') ? 'p2' : (a.current >= b.current ? 'p1' : 'p2');
            const winner = { side: winnerSide, state: winnerSide === 'p1' ? a : b };
            const duration = timelineTime() || 'Battle complete';
            const stats = [
              winner.state.current + '/' + winner.state.max + ' HP',
              energy(winner.side) + ' energy',
              shieldCount(winner.side) + ' shield' + (shieldCount(winner.side) === 1 ? '' : 's')
            ];
            const key = [winner.side, winnerName, duration, ...stats].join('|');
            if (box.dataset.key !== key) {
              box.dataset.key = key;
              box.style.setProperty('--lab-outcome', winner.side === 'p1' ? '#13836b' : '#6e55a9');
              box.querySelector('strong').textContent = winnerName + ' wins';
              box.querySelector('small').textContent = duration;
              box.querySelector('.ui-lab-outcome-stats').innerHTML = stats.map(value => '<span>' + value + '</span>').join('');
            }
            box.classList.add('is-visible');
          }
          function improveTeamState() {
            const status = byId('teamBuilderAnalysisStatus'); const meta = byId('teamBuilderMetaStatus');
            if (!status || !meta) return;
            if (/all\s+\d+\s+deterministic matchups are ready/i.test(status.textContent)) {
              if (meta.textContent !== 'Competitive field ready. Deterministic matchup coverage is prepared.') meta.textContent = 'Competitive field ready. Deterministic matchup coverage is prepared.';
              meta.classList.add('team-analysis-ready');
            } else { meta.classList.remove('team-analysis-ready'); }
          }
          function exposeMobileDecision() {
            if (!matchMedia('(max-width: 900px)').matches || document.body.dataset.view !== 'scenario-review') return;
            const shell = byId('manualMobileBottomSheetShell');
            const handle = byId('manualMobileSheetHandle');
            if (shell && handle && shell.dataset.state === 'collapsed' && !shell.dataset.uiLabOpened) {
              shell.dataset.uiLabOpened = 'true'; handle.click();
            }
          }
          function refresh() { ensureBadge(); updateOutcome(); improveTeamState(); exposeMobileDecision(); }
          let refreshQueued = false;
          const observer = new MutationObserver(() => {
            if (refreshQueued) return;
            refreshQueued = true;
            requestAnimationFrame(() => { refreshQueued = false; refresh(); });
          });
          observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['data-view', 'class', 'hidden'] });
          window.addEventListener('resize', exposeMobileDecision, { passive: true });
          window.addEventListener('load', () => { refresh(); setTimeout(refresh, 80); });
          // The simulator streams timeline labels independently from the result panel; a light poll keeps the derived summary in sync.
          window.setInterval(updateOutcome, 180);
          refresh();
        })();
      ` + '</' + 'script>';

      fetch('PogoPvp.html', { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Could not load the shared application document.');
          return response.text();
        })
        .then(source => {
          source = source.replace(/<body(\s[^>]*)?>/i, (_, attrs = '') => '<body' + attrs + ' class="ui-lab">');
          source = source.replace('</head>', '<style id="uiLabStyles">' + labCss + '</style></head>');
          source = source.replace('</body>', labScript + '</body>');
          document.open(); document.write(source); document.close();
        })
        .catch(error => { document.body.innerHTML = '<main class="ui-lab-loader">UI Lab could not start: ' + error.message + '</main>'; });
    })();
  </script>
